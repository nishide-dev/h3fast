[project]
name = "h3fast"
version = "0.1.0"
description = "Reproducible optimization tooling for local MiniMax H3-Base inference"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "nishide-dev", email = "nishide.dev@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
h3fast = "h3fast.cli:main"

[project.urls]
Documentation = "https://github.com/nishide-dev/h3fast/tree/main/docs"
Issues = "https://github.com/nishide-dev/h3fast/issues"
Repository = "https://github.com/nishide-dev/h3fast"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3fast"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "h3fast/schemas"
"runtime/ffprobe.py" = "h3fast/runtime/ffprobe.py"

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.3",
    "ty==0.0.72",
]
quality-metrics = [
    "lpips==0.1.4",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.14.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
output-format = "full"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]

[tool.coverage.run]
source = ["h3fast"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
