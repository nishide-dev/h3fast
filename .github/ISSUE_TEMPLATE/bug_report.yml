name: Bug report
description: 再現可能な不具合を報告します。
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issueタイトルは英語、以下の内容は日本語で記載してください。
  - type: textarea
    id: background
    attributes:
      label: 背景と影響
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 重み、token、顧客入力を含めないでください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 検証環境
      description: H3Fast、Python、SGLang、PyTorch、driver、GPU等を記載してください。
    validations:
      required: true
